<div class="rounded-lg border border-taupe-200 bg-white p-4">
    <div class="flex flex-wrap items-baseline justify-between gap-2">
        <h2 class="text-sm font-semibold text-taupe-900">Pressure</h2>
        <p class="text-xs tabular-nums text-taupe-400">
            <span class="mr-1">mPa</span>
            <span data-window-count>--</span> points
            <span class="mx-1">&middot;</span>
            <span data-window-span>--</span>s window
        </p>
    </div>
    <div id="chart-container" class="mt-2 w-full"></div>
</div>

<script>
  (() => {
    const target = document.getElementById('chart-container');
    const countEl = document.querySelector('[data-window-count]');
    const spanEl = document.querySelector('[data-window-span]');

    const HEIGHT = 300;

    // uPlot draws to canvas and inline SVG, so Tailwind classes never reach it.
    // Read the palette off :root rather than duplicating hex values here.
    const css = getComputedStyle(document.documentElement);
    const theme = (name) => css.getPropertyValue(name).trim();

    const line = theme('--color-cinnamon-wood-500');
    const gridColor = theme('--color-taupe-200');
    const tickColor = theme('--color-taupe-300');
    const labelColor = theme('--color-taupe-500');
    const axisFont = '11px system-ui, sans-serif';

    let chart = null;

    const opts = {
      // uplot.css sets .uplot { width: min-content }, so the width has to be
      // explicit or the chart ignores its container entirely.
      width: Math.max(target.clientWidth, 200),
      height: HEIGHT,
      tzDate: (ts) => new Date(ts * 1000),   // stream sends unix seconds
      scales: {
        x: { time: true },
        y: { auto: true },
      },
      series: [
        {},                                     // x
        {
          label: 'Pressure',
          stroke: line,
          width: 2,
          fill: `color-mix(in oklab, ${line} 12%, transparent)`,
          points: { show: false },
        },
      ],
      axes: [
        {
          stroke: labelColor,
          grid: { stroke: gridColor, width: 1 },
          ticks: { stroke: tickColor, width: 1 },
          font: axisFont,
        },
        {
          stroke: labelColor,
          grid: { stroke: gridColor, width: 1 },
          ticks: { stroke: tickColor, width: 1 },
          font: axisFont,
          size: 64,
        },
      ],
      cursor: {
        drag: { x: true, y: false },
        points: { size: 8 },
      },
      legend: { live: true },
    };

    const off = App.onFrame((frame) => {
      const w = frame.window;
      if (!w || !w.t || !w.t.length) return;

      // Every frame carries the full rolling window, so setData replaces it
      // wholesale. No appending or shifting needed.
      const data = [w.t, w.value];
      if (chart === null) {
        chart = new uPlot(opts, data, target);
      } else {
        chart.setData(data);
      }

      countEl.textContent = w.t.length;
      spanEl.textContent = Math.round(w.t[w.t.length - 1] - w.t[0]);
    });

    const onResize = () => {
      if (chart === null) return;
      chart.setSize({ width: Math.max(target.clientWidth, 200), height: HEIGHT });
    };
    window.addEventListener('resize', onResize);

    // Release the subscription if htmx ever swaps this partial out.
    document.body.addEventListener('htmx:beforeCleanupElement', (event) => {
      if (event.detail.elt.contains(target)) {
        off();
        window.removeEventListener('resize', onResize);
      }
    });
  })();
</script>
