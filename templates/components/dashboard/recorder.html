<div class="rounded-lg border border-taupe-200 bg-white p-4">
  <div class="flex flex-wrap items-center justify-between gap-2">
    <h2 class="text-sm font-semibold text-taupe-900">Recording</h2>
    <p id="rec-status" class="text-xs text-taupe-400">Idle</p>
  </div>

  <div class="mt-3 grid grid-cols-4 gap-2 text-xs text-taupe-400">
    <label>Net <input id="rec-net" maxlength="2" value="XX" class="w-full rounded border border-taupe-200 px-2 py-1 uppercase text-taupe-900"></label>
    <label>Sta <input id="rec-sta" maxlength="5" value="ESP32" class="w-full rounded border border-taupe-200 px-2 py-1 uppercase text-taupe-900"></label>
    <label>Loc <input id="rec-loc" maxlength="2" value="00" class="w-full rounded border border-taupe-200 px-2 py-1 uppercase text-taupe-900"></label>
    <label>Chan <input id="rec-cha" maxlength="3" value="HDF" class="w-full rounded border border-taupe-200 px-2 py-1 uppercase text-taupe-900"></label>
  </div>

  <div class="mt-3 flex flex-wrap gap-2">
    <button id="rec-toggle" class="rounded-md bg-taupe-900 px-3 py-1.5 text-sm text-white">Start</button>
    <button id="rec-save" class="rounded-md border border-taupe-200 px-3 py-1.5 text-sm" disabled>Download CSV</button>
    <button id="rec-save-mseed" class="rounded-md border border-taupe-200 px-3 py-1.5 text-sm" disabled>Download miniSEED</button>
    <button id="rec-clear" class="rounded-md border border-taupe-200 px-3 py-1.5 text-sm" disabled>Clear</button>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const toggle = $('rec-toggle'), save = $('rec-save'), mseed = $('rec-save-mseed'),
        clear = $('rec-clear'), status = $('rec-status');

  const ids = () => ({ net: $('rec-net').value, sta: $('rec-sta').value,
                       loc: $('rec-loc').value, cha: $('rec-cha').value });

  const fmt = (n) => {                       // samples -> m:ss at 100 Hz
    const s = Math.floor(n / 100);
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  };

  const rec = new Recorder({
    onchange: (r) => {
      toggle.textContent = r.recording ? 'Stop' : 'Start';
      save.disabled = mseed.disabled = clear.disabled = r.recording || r.samples === 0;
      status.textContent = r.error ? 'Storage error: ' + r.error.name
        : r.recording ? 'Recording ' + fmt(r.samples)
        : r.samples ? 'Stopped, ' + fmt(r.samples) + ' captured'
        : 'Idle';
    },
  });

  toggle.onclick = () => (rec.recording ? rec.stop() : rec.start());
  save.onclick   = () => rec.downloadCsv();
  clear.onclick  = () => rec.clear();
  mseed.onclick  = async () => {
    try { await rec.downloadMseed(undefined, ids()); }
    catch (e) { status.textContent = e.message; }   // e.g. a bad station code
  };

  App.onFrame((frame) => rec.onFrame(frame));
})();
</script>
